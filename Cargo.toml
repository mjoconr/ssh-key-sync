[workspace]
members = [
    "crates/client",
    "crates/core",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.4.10"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
ssh-key-sync-core = { version = "0.4.10", path = "crates/core" }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
ipnet = { version = "2.12", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ssh-key = "0.6.7"
thiserror = "2.0"
toml = "0.9"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
roxmltree = "0.20"
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.27"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
if-addrs = "0.15"
ratatui = "0.30"
crossterm = "0.29"
arc-swap = "1.7"

