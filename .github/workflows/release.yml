name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match tag to package version
        run: |
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "ssh-key-sync-server") | .version'
          )"
          test "$GITHUB_REF_NAME" = "v$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-latest
            arch: i686
            target: i686-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build static binaries
        run: |
          chmod +x scripts/build-musl.sh
          TARGET_ARCH="${{ matrix.arch }}" scripts/build-musl.sh

      - name: Package release assets
        run: |
          mkdir -p release
          mkdir -p release/package
          cp ".local/linux-bin/${{ matrix.arch }}/ssh-key-sync-client" release/package/ssh-key-sync-client
          cp ".local/linux-bin/${{ matrix.arch }}/ssh-key-sync-server" release/package/ssh-key-sync-server
          tar -C release/package -czf "release/ssh-key-sync-client-${{ matrix.target }}.tar.gz" ssh-key-sync-client
          tar -C release/package -czf "release/ssh-key-sync-server-${{ matrix.target }}.tar.gz" ssh-key-sync-server

      - name: Upload architecture assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download architecture assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Package release assets
        run: |
          cp install.sh release/install.sh
          cp install-server.sh release/install-server.sh
          cp release-keys/release-v1.pub release/release.pub
          cp deploy/ssh-key-sync-client.service release/
          cp deploy/ssh-key-sync-client.timer release/
          cp deploy/ssh-key-sync-client-update.service release/
          cp deploy/ssh-key-sync-client-update.timer release/
          cp deploy/ssh-key-sync-server.service release/
          cp deploy/ssh-key-sync-server-update.service release/
          cp deploy/ssh-key-sync-server-update.timer release/
          cp deploy/ssh-key-sync-reboot.service release/
          cp deploy/ssh-key-sync-reboot.timer release/
          cp deploy/ssh-key-sync-backup.service release/
          cp deploy/ssh-key-sync-backup.timer release/
          cd release
          sha256sum ./*.tar.gz ./install.sh ./install-server.sh ./release.pub ./ssh-key-sync-*.service ./ssh-key-sync-*.timer |
            sed 's#  \./#  #' > SHA256SUMS

      - name: Publish draft release for offline signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --draft

