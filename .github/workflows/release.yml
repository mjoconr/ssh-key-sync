name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Build static client
        run: |
          chmod +x scripts/build-musl-client.sh
          scripts/build-musl-client.sh

      - name: Package release assets
        run: |
          asset="ssh-key-sync-client-x86_64-unknown-linux-musl"
          mkdir -p release
          cp .local/linux-bin/ssh-key-sync-client-musl "release/$asset"
          cp install.sh release/install.sh
          tar -C release -czf "release/$asset.tar.gz" "$asset"
          rm "release/$asset"
          cd release
          sha256sum ./*.tar.gz | sed 's#  \./#  #' > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

