schema_version = 1
listen = "127.0.0.1:18080"
signing_key_file = "../.local/signing.key"
public_url = "https://keys.example.net"
default_auto_update = true
# Report a machine token as stale after this many hours without a key request.
stale_after_hours = 48
# Optional admin-hosted first-install bootstrap script.
# bootstrap_url = "https://keys.example.net/bootstrap/bootstrap.sh"
default_group = "public"
require_forwarded_client_ip = false

[groups.public]
visibility = "public"

# Legacy XML-RPC requires an explicit CIDR; unmatched sources are rejected.
[groups.restricted]
visibility = "private"
token_ttl_days = 90
legacy_xmlrpc = true
cidrs = ["203.0.113.0/24"]

[keys.example]
groups = ["public"]
keys = [
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILM+rvN+ot98qgEN796jTiQfZfG1KaT0PtFDJ/XFSqti example-only",
]
